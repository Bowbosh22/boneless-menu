<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu — Boneless AFR Street Food</title>
<meta name="description" content="Menu de Boneless AFR Street Food, Brazzaville : poulet désossé croustillant, wings, burgers smash. Ouvert 24h/24, Hôtel Saphir.">
<link rel="canonical" href="https://bowbosh22.github.io/boneless-menu/">
<meta name="theme-color" content="#141110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Work+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffb020;--terra:#ff5a1f;--text:#f6efe4;--green:#25d366;--display:'Bungee','Arial Black',Impact,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#141110}
body{font-family:'Work Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;text-decoration:none;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.screen{position:relative;min-height:100vh;min-height:100dvh;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;overflow:clip;isolation:isolate;padding:env(safe-area-inset-top) 0 0}
.bg{position:absolute;inset:0;z-index:-2;background:#1d1a17 var(--hero) center/cover no-repeat;transition:filter .4s}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(20,17,16,.9) 0%,rgba(20,17,16,.55) 30%,rgba(20,17,16,.2) 45%,rgba(20,17,16,.6) 72%,rgba(20,17,16,.94) 100%);transition:background .4s}
.screen.deep .bg{filter:blur(10px) brightness(.7);transform:scale(1.08)}
.screen.deep .veil{background:linear-gradient(to bottom,rgba(20,17,16,.86),rgba(20,17,16,.74) 50%,rgba(20,17,16,.94))}
.view{flex:1;display:flex;flex-direction:column;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Accueil */
.logo{margin:clamp(30px,7vh,64px) auto 0;text-align:center;padding:0 24px}
.wordmark{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,12vw,3.2rem);line-height:.95;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 3px 18px rgba(0,0,0,.6)}
.tagline{margin-top:10px;font-size:.66rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.slogan{margin-top:12px;font-size:.78rem;font-weight:600;color:rgba(246,239,228,.88);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.rule{width:44px;height:2px;background:var(--terra);margin:14px auto 0;border-radius:2px}
.spacer{flex:1;min-height:14px}
.hello{text-align:center;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(246,239,228,.85);margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:112px;padding:12px 8px;border-radius:16px;text-align:center;background:rgba(255,255,255,.11);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .18s,background .18s,border-color .18s}
.tile:last-child:nth-child(odd){grid-column:1 / -1;min-height:92px}
.tile:active,.tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.18);border-color:rgba(255,176,32,.85)}
.tile svg{width:38px;height:38px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.tile small{font-size:.6rem;font-weight:600;letter-spacing:.04em;color:rgba(246,239,228,.72)}
.info{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:14px 16px 0;font-size:.66rem;font-weight:600;letter-spacing:.06em;color:rgba(246,239,228,.8)}
.info span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--terra);margin-right:7px;vertical-align:middle}
.info .tbl::before{display:none}

/* Barre du bas */
.bar{margin-top:16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(20,17,16,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12);position:sticky;bottom:0}
.bar .it{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,239,228,.85)}
.bar .it svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar .menu{width:62px;height:62px;margin-top:-34px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--terra);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 5px rgba(20,17,16,.78);font-size:.55rem;font-weight:800;letter-spacing:.14em}
.bar .menu svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar .wa{color:var(--green)}

/* En-tête intérieur */
.topbar{display:flex;align-items:center;gap:14px;padding:18px 16px 6px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.back svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumb{font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.ttl{font-family:var(--display);font-size:1.7rem;line-height:1.05;letter-spacing:.02em;text-transform:uppercase}

/* Liste */
.banner{margin:14px 16px 0;height:170px;border-radius:18px;border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 26px rgba(0,0,0,.4);background:var(--img) var(--bpos,center)/cover no-repeat;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,17,16,.5),transparent 60%)}
.tbl{display:inline-block;margin-bottom:6px;padding:5px 14px;border-radius:999px;background:var(--gold);color:#241707;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem}
.dishes{list-style:none;padding:6px 20px 28px}
.dish{display:flex;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid rgba(255,255,255,.16);animation:in .4s both}
.dish .th{flex:none;width:84px;height:84px;border-radius:14px;background:var(--img) center/cover no-repeat;border:1px solid rgba(255,255,255,.2);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.dish .n{flex:1;min-width:0}
.dish .n b{display:block;font-size:1rem;font-weight:700}
.dish .n span{display:block;margin-top:3px;font-size:.8rem;color:rgba(246,239,228,.68)}
.dish .n em{display:inline-block;margin-bottom:5px;font-style:normal;font-size:.56rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--gold);color:#241707}
.dish .p{white-space:nowrap;font-weight:800;color:var(--gold);align-self:baseline}
.dish .p small{font-size:.66rem;font-weight:700;color:rgba(246,239,228,.65);margin-left:3px}
.dish .p.none{color:rgba(246,239,228,.35);font-weight:600}
.note{margin:0 20px 28px;font-size:.7rem;color:rgba(246,239,228,.6);text-align:center}

@media (min-width:521px){body{display:grid;place-items:center}.screen{min-height:min(100vh,900px);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main class="screen" id="screen">

  <!-- ACCUEIL -->
  <section class="view" id="v-home">
    <header class="logo">
      <h1 class="wordmark">Boneless</h1>

  <!-- LISTE -->

</main>

  signatures: '<path d="M18 28h28l-4 28H22z"/><path d="M22 28l-2-16M29 28l-1-20M36 28l1-20M43 28l3-16"/>',
  grillades:  '<path d="M10 28a22 18 0 0 1 44 0z"/><path d="M8 36h48"/><path d="M10 44h44"/><path d="M12 44c0 8 8 10 20 10s20-2 20-10"/>'
};

const SECTIONS = {
  top: { label:"Incontournables", sub:"Nos 6 stars", img:"hero", dishes:[
    { n:"Poulet Désossé Croustillant", d:"Filets panés, frits minute, frites et sauce maison", tag:"Signature", img:"poulet" },
    { n:"Wings Boneless", d:"Ailes grillées, laquées sauce barbecue épicée", tag:"Pimenté", img:"wings" },
    { n:"Boneless Double Cheese", d:"Double steak smashé, cheddar, champignons, bacon", tag:"Best-seller", img:"double" },
    { n:"Boneless Classic Smash", d:"Double steak smashé, cheddar, bacon, sauce fromagère", tag:"Classique", img:"classic" },
    { n:"Boneless BBQ Onion", d:"Steak grillé, cheddar, oignons croustillants, sauce BBQ", tag:"Nouveau", img:"bbq" },
    { n:"Boneless Crispy Chef", d:"Steak grillé, oignons frits, sauce fromagère du chef", tag:"Chef", img:"chef" } ]},
  signatures: { label:"Signatures maison", sub:"Frite XXL · Assiette familiale", img:"poulet", pos:"center 88%", dishes:[
    { n:"Frite signature AFR XXL", p:"3 000" },
    { n:"Assiette Familiale", d:"16 pièces + frite + salade de chou", p:"16 000" } ]},
  grillades: { label:"Grillades & burgers", sub:"Poulet · Burgers · Hot dog", img:"double", note:"Carte partielle · prix à confirmer avec l'équipe", dishes:[
    { n:"Poulet désossé croustillant" },
    { n:"Burgers gourmands" },
    { n:"Korean hot dog" } ]}
};
/* ===================================================================== */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url = (k) => `url('${IMG[k]}')`;

$(".bg").style.setProperty("--hero", url("hero"));
$("#tiles").innerHTML = Object.entries(SECTIONS).map(([id, s]) => `
  <a class="tile" href="#${id}">
    <svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[id]}</svg>
    <b>${esc(s.label)}</b><small>${esc(s.sub)}</small>
  </a>`).join("");
$("#info").innerHTML = `<span>${esc(RESTO.adresse)}</span><span>${esc(RESTO.horaires)}</span>`;
$("#map").href = RESTO.carte;
const TABLE = (new URLSearchParams(location.search).get("table") || "").replace(/\D/g,"").slice(0,3);
$("#wa").href = `https://wa.me/${RESTO.whatsapp}?text=` + encodeURIComponent(TABLE ? `Bonjour Boneless, table ${TABLE} : je souhaite passer une commande.` : "Bonjour Boneless, je souhaite passer une commande.");
if (TABLE) $("#info").insertAdjacentHTML("afterbegin", `<span class="tbl">Table ${TABLE}</span>`);

function show(id, deep){
  ["v-home","v-list"].forEach(v => { $("#"+v).hidden = v !== id; });
  $("#screen").classList.toggle("deep", !!deep);
  window.scrollTo(0, 0);
}

function route(){
  const sec = location.hash.replace("#","").split("/")[0];
  const S = SECTIONS[sec];
  if (!S) return show("v-home", false);
  $("#list-title").textContent = S.label;
  const bn = $("#banner"); bn.hidden = !S.img || sec === "top";
  if (!bn.hidden) { bn.style.setProperty("--img", url(S.img)); bn.style.setProperty("--bpos", S.pos || "center"); }
  $("#dishes").innerHTML = S.dishes.map((d, i) => `
    <li class="dish" style="animation-delay:${i*40}ms">
      ${d.img ? `<div class="th" style="--img:${url(d.img)}" role="img" aria-label="${esc(d.n)}"></div>` : ""}
      <div class="n">${d.tag ? `<em>${esc(d.tag)}</em>` : ""}<b>${esc(d.n)}</b>${d.d ? `<span>${esc(d.d)}</span>` : ""}</div>
      ${d.p ? `<div class="p">${esc(d.p)}<small>F</small></div>` : (d.img ? "" : `<div class="p none">—</div>`)}
    </li>`).join("");
  const nt = $("#note"); nt.hidden = !S.note; nt.textContent = S.note || "";
  show("v-list", true);
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
